# Static site — no build step. Netlify serves the repo root as-is.
[build]
  publish = "."
  command = ""

# Long-cache the versioned static assets (URLs carry ?v=N; bump on deploy)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
